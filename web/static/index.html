<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2A Platform</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f7f4;
        color: #202124;
      }

      main {
        width: min(560px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #5f6368;
        line-height: 1.6;
      }

      code {
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(32, 33, 36, 0.08);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A2A Platform API is running</h1>
      <p>
        当前二进制未嵌入完整 Admin UI。运行 <code>make build</code>
        后会编译 React 前端并在生产二进制中嵌入真实页面。
      </p>
    </main>
  </body>
</html>
