server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;

  location /api/ {
    proxy_pass http://platform:18090/api/;
  }

  location = /health {
    proxy_pass http://platform:18090/health;
  }

  location /agent/ {
    proxy_pass http://platform:18090/agent/;
  }

  location /.well-known/ {
    proxy_pass http://platform:18090/.well-known/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
